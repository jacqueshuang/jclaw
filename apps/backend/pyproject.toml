[project]
name = "jclaw-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "pydantic-settings>=2.8.0,<3.0.0",
  "sqlalchemy>=2.0.38,<3.0.0",
  "alembic>=1.14.1,<2.0.0",
  "psycopg[binary]>=3.2.6,<4.0.0",
  "anthropic>=0.49.0,<1.0.0",
  "openai>=1.68.0,<2.0.0",
  "google-genai>=1.7.0,<2.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3.0,<9.0.0",
  "httpx>=0.28.0,<1.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
